            $ref: "#/definitions/ScreenshotList"
        "400":
          $ref: "#/responses/InvalidRequest"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          description: Error
          schema:
            $ref: "#/definitions/ScreenshotError"
        "503":
          $ref: "#/responses/Unavailable"
      consumes:
        - application/x-www-form-urlencoded
  /screenshot/info:
    get:
      summary: Query screenshot status
      operationId: GetScreenshotInfo
      description: Once a screenshot has been requested, its status must be checked until it is either "error"
        or "finished".
      parameters:
        - name: id
          in: query
          description: Screenshot ID returned when requesting a capture.
          required: true
          type: integer
      tags:
        - Screenshot
      responses:
        "200":
          description: Screenshot found
          schema:
            $ref: "#/definitions/Screenshot"
        "400":
          $ref: "#/responses/InvalidRequest"
        "401":
          $ref: "#/responses/Unauthorized"
        "404":
          $ref: "#/responses/NotFound"
        "503":
          $ref: "#/responses/Unavailable"
        default:
          description: Screenshot not found
          schema:
            $ref: "#/definitions/ScreenshotInfoError"
  /screenshot/list:
    get:
      summary: Get information about screenshots
      operationId: GetMultipleScreenshotsInfo
      description: Get information about the last 100 screenshots requested.
      x-ms-visibility: none
      parameters:
        - name: limit
          in: query
          description: maximum number of screenshots' information to return
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        - name: status
          in: query
          description: get list of screenshot in a given status (error, finished, in_process)
          type: string
          enum:
            - error
            - finished
            - in_process
        - $ref: "#/parameters/tag_filter"
      tags:
        - Screenshot
      responses:
        "200":
          description: list of screenshot information
          schema:
            $ref: "#/definitions/ScreenshotList"
        default:
          description: Screenshot not found
          schema:
            $ref: "#/definitions/ScreenshotError"
  /screenshot/search:
    get:
      summary: Search for screenshots
      operationId: SearchScreenshot
      description: Search for screenshots of a specific URL.
      x-ms-visibility: none
      parameters:
        - name: url
          in: query
          description: look for a string matching the URL requested
          type: string
          required: true
        - name: limit
          in: query
          description: maximum number of screenshots' information to return
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        - name: status
          in: query
          description: get list of screenshot in a given status (error, finished, in_process)
          type: string
          enum:
            - error
            - finished
            - in_process
        - $ref: "#/parameters/tag_filter"
      tags:
        - Screenshot
      responses:
        "200":
          description: list of screenshot information
          schema:
            $ref: "#/definitions/ScreenshotList"
        default:
          description: Screenshot not found
          schema:
            $ref: "#/definitions/ScreenshotError"
  /screenshot/thumbnail:
    get:
      summary: Retrieve a thumbnail image
      operationId: GetThumbnail
      x-ms-trigger: none
      description: >-
        Unlike the other API calls, this API sends back the thumbnail as a PNG file, not JSON. The HTTP
        response code indicates whether the screenshot was successful (200), or incomplete (404) or
        failed (404). If the screenshot failed or is not finished, a default image "Not found" is sent.


        You can crop your screenshots. The crop is done first, then the thumbnail. You can take a
        1024x768 screenshot, crop it to 768x768, and get it scaled down to 300x300.
      produces:
        - image/png
        - image/jpeg
      parameters:
        - name: id
          in: query
          description: screenshot ID
          type: integer
          required: true
        - name: width
          in: query
          description: width of the thumbnail
          type: integer
          minimum: 1
          maximum: 2000
        - name: height
          in: query
          description: height of the thumbnail
          type: integer
          minimum: 1
          maximum: 15000
        - name: scale
          in: query
          description: Output scale. Without explicit dimensions, defaults to 1 divided by the capture device scale.
          type: number
          format: double
        - name: zoom
          description: zoom 1 to 100 percent
          in: query
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        - name: ratio
          in: query
          description: "Use fit to keep the original page ration, and fill to get a thumbnail for the exact width
            and height.  specified. If you provide both width and height, you need to specify the ratio:
            fit to keep the original width/height ratio (the thumbnail might be smaller than the
            specified width and height), or fill to crop the image if necessary."
          type: string
          enum:
            - fit
            - fill
          default: fit
        - name: left
          in: query
          description: left edge of the area to be cropped
          type: integer
          minimum: 0
          default: 0
        - name: right
          in: query
          description: right edge of the area to be cropped
          type: integer
          minimum: 0
          default: 0
        - name: top
          in: query
          description: top edge of the area to be cropped
          type: integer
          minimum: 0
          default: 0
        - name: bottom
          in: query
          description: bottom edge of the area to be cropped
          type: integer
        - name: format
          in: query
          description: image as PNG or JPEG
          type: string
          enum:
            - png
            - jpeg
          default: png
        - name: shot
          in: query
          description: get the second or third screenshot if multiple screenshots were requested
          type: integer
          minimum: 1
          maximum: 10
          default: 1
        - name: quality
          in: query
          description: JPEG quality factor (for JPEG thumbnails only)
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      tags:
        - Screenshot
      responses:
        "200":
          description: thumbnail
        "404":
          description: Screenshot not found
  /screenshot/share:
    get:
      summary: Share a screenshot
      operationId: ShareScreenshot
      x-ms-trigger: none
      description: Share a finished screenshot publicly, with an optional note.
      parameters:
        - name: id
          in: query
          description: screenshot ID
          type: integer
          required: true
        - name: note
          in: query
          description: note to add on the sharing page
          type: string
      tags:
        - Screenshot
      responses:
        "200":
          description: Public share URL
          schema:
            type: object
            required:
              - id
              - status
              - url
            properties:
              id:
                type: integer
                format: int64
                minimum: 1
              status:
                type: string
                enum:
                  - ok
              url:
                type: string
        default:
          description: Screenshot not found
          schema:
            $ref: "#/definitions/ScreenshotInfoError"
  /screenshot/delete:
    get:
      summary: Delete screenshot data
      operationId: DeleteScreenshot
      x-ms-trigger: none
      description: You can delete details of your screenshots to remove any confidential information.
      parameters:
        - name: id
          in: query
          description: screenshot ID
          type: integer
          required: true
        - name: data
          in: query
          description: >
            data to remove. You can specify multiple of them (separated by a ,): *image* (image files),
            *url* (url requested), *metadata* (time added, time finished, post data, cookie and referer
            used for the screenshot), *all* (all data and files)
          type: string
          default: image
      tags:
        - Screenshot
      responses:
        "200":
          description: Requested data deleted
          schema:
            type: object
            required:
              - id
              - status
            properties:
              id:
                type: integer
                format: int64
                minimum: 1
              status:
                type: string
                enum:
                  - ok
        default:
          description: Screenshot not found
          schema:
            $ref: "#/definitions/ScreenshotError"
  /screenshot/html:
    get:
      summary: Get the HTML code
      operationId: GetHTML
      description: Retrieve the HTML code of the rendered page. This API call should be used when html=1 was
        specified in the screenshot request.
      produces:
        - text/html
      parameters:
        - name: id
          in: query
          description: screenshot ID
          type: integer
          required: true
      tags:
        - Screenshot
      responses:
        default:
          description: HTML code
  /screenshot/pdf:
    parameters:
      - $ref: "#/parameters/ArtifactScreenshotId"
    get:
      summary: Download a screenshot PDF
      operationId: GetScreenshotPDF
      description: |-
        Download the PDF from a finished screenshot owned by your account.
        Enable pdf=1 when creating the capture and wait for screenshot/info to
        return status=finished. Error responses are JSON.
      produces:
        - application/pdf
        - application/json
      tags:
        - Screenshot
      responses:
        "200":
          $ref: "#/responses/PDFDownload"
        "400":
          $ref: "#/responses/InvalidRequest"
        "401":
          $ref: "#/responses/Unauthorized"
        "404":
          $ref: "#/responses/NotFound"
        "503":
          $ref: "#/responses/Unavailable"
    post:
      summary: Download a screenshot PDF
      operationId: PostScreenshotPDF
      description: |-
        Download the PDF from a finished screenshot owned by your account.
        Enable pdf=1 when creating the capture and wait for screenshot/info to
        return status=finished. Error responses are JSON.
      produces:
        - application/pdf
        - application/json
      tags:
        - Screenshot
      responses:
        "200":
