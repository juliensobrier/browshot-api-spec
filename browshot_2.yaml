        "400":
          $ref: "#/responses/InvalidRequest"
        "401":
          $ref: "#/responses/Unauthorized"
        "404":
          $ref: "#/responses/NotFound"
        "503":
          $ref: "#/responses/Unavailable"
  /batch/create:
    post:
      consumes:
        - multipart/form-data
      summary: Requests thousands of screenshots at once
      operationId: CreateBatch
      x-ms-trigger: none
      description: Upload a text file with one URL per line as multipart/form-data. All URLs use the same
        capture settings and apps. The v1 batch ZIP remains available independently of app execution.
        Failed captures may be retried up to three times.
      parameters:
        - name: file
          in: formData
          description: text file to use
          type: file
          required: true
        - $ref: "#/parameters/form_browser"
        - $ref: "#/parameters/form_country"
        - $ref: "#/parameters/form_screen_width"
        - $ref: "#/parameters/form_screen_height"
        - $ref: "#/parameters/form_mobile"
        - $ref: "#/parameters/form_device"
        - name: size
          in: formData
          description: screenshots size - "screen" (default) or "page"
          type: string
          enum:
            - screen
            - page
          default: screen
        - name: name
          in: formData
          description: name of the batch
          type: string
        - name: width
          in: formData
          description: thumbnail width.
          type: integer
          minimum: 1
          maximum: 2000
          default: 1024
        - name: height
          in: formData
          description: thumbnail height
          type: integer
          minimum: 1
          maximum: 15000
        - name: delay
          in: formData
          description: number of seconds to wait after the page has loaded. This is used to let JavaScript run
            longer before taking the screenshot. Use delay=0 to take screenshots faster.
          type: integer
          default: 5
          minimum: 0
          maximum: 60
        - name: referer
          in: formData
          description: use a custom referrer header
          type: string
        - name: post_data
          in: formData
          description: send a POST requests with post_data, useful for filling out forms
          type: string
        - name: cookie
          in: formData
          description: set a cookie for the URL requested (see Custom POST Data, Referer and Cookie) Cookies should
            be separated by a ;
          type: string
        - name: script
          in: formData
          description: URL of javascript file to execute after the page load event
          type: string
        - name: html
          in: formData
          description: saves the HTML of the rendered page which can be retrieved by the API call screenshot/html.
            This feature costs *1 credit* per screenshot.
          type: integer
          minimum: 0
          maximum: 1
          default: 0
        - name: max_wait
          in: formData
          description: "maximum number of seconds to wait before triggering the PageLoad event. Note that delay
            will still be used. (default: 0 = disabled)"
          type: integer
          minimum: 0
          maximum: 60
          default: 0
        - name: headers
          in: formData
          description: any custom HTTP headers. (Not supported with Internet Explorer)
          type: string
        - name: format
          in: formData
          description: image as PNG or JPEG
          type: string
          enum:
            - png
            - jpeg
          default: png
        - name: device_scale
          in: formData
          description: Pixel density multiplier. Use 2 or 3 for retina output at the same CSS viewport size. Defaults to
            1. The retina viewport is limited to 20 million physical pixels. Video requires a scale of 1.
          type: integer
          enum:
            - 1
            - 2
            - 3
        - name: hide_ads
          in: formData
          description: Block advertising requests and hide matching ad elements. Adds no credits.
          type: integer
          enum:
            - 0
            - 1
          default: 0
        - name: pdf
          in: formData
          description: Generate a PDF in addition to the screenshot. Requires a Chrome capture and adds one
            credit. Use pdf=1 when supplying pdf_* options.
          type: integer
          enum:
            - 0
            - 1
          default: 0
        - name: pdf_format
          in: formData
          description: PDF paper size. Ignored when pdf_one_page is enabled. Defaults to letter.
          type: string
          enum:
            - letter
            - a4
            - legal
        - name: pdf_background
          in: formData
          description: Include background colors and images in the PDF. Defaults to 0.
          type: integer
          enum:
            - 0
            - 1
        - name: pdf_one_page
          in: formData
          description: Create one long PDF page using the viewport width and document height. Defaults to 0.
          type: integer
          enum:
            - 0
            - 1
        - name: pdf_landscape
          in: formData
          description: Use landscape orientation for the PDF. Defaults to 0.
          type: integer
          enum:
            - 0
            - 1
        - name: pdf_margin
          in: formData
          description: Set all four PDF margins to a nonnegative length. Units can be px, mm, cm, or in. A value
            without units is in pixels. Defaults to 0px.
          type: string
          pattern: ^\d+(\.\d+)?(px|mm|cm|in)?$
          maxLength: 32
        - name: pdf_margin_top
          in: formData
          description: Override the top PDF margin. Defaults to pdf_margin.
          type: string
          pattern: ^\d+(\.\d+)?(px|mm|cm|in)?$
          maxLength: 32
        - name: pdf_margin_bottom
          in: formData
          description: Override the bottom PDF margin. Defaults to pdf_margin.
          type: string
          pattern: ^\d+(\.\d+)?(px|mm|cm|in)?$
          maxLength: 32
        - name: pdf_margin_left
          in: formData
          description: Override the left PDF margin. Defaults to pdf_margin.
          type: string
          pattern: ^\d+(\.\d+)?(px|mm|cm|in)?$
          maxLength: 32
        - name: pdf_margin_right
          in: formData
          description: Override the right PDF margin. Defaults to pdf_margin.
          type: string
          pattern: ^\d+(\.\d+)?(px|mm|cm|in)?$
          maxLength: 32
        - name: video
          in: formData
          description: Record a video or animated GIF in addition to the screenshot. Requires a Chrome capture
            at device scale 1. Adds one credit per started five seconds. Use video=1 when supplying
            video_* options.
          type: integer
          enum:
            - 0
            - 1
          default: 0
        - name: video_format
          in: formData
          description: Recording format. If MP4 encoding is unavailable, the capture can produce WebM. Defaults to
            webm.
          type: string
          enum:
            - webm
            - mp4
            - gif
        - name: video_duration
          in: formData
          description: Maximum recording duration in seconds. Charges are calculated from the requested duration.
            Defaults to 15 seconds.
          type: integer
          minimum: 1
          maximum: 30
        - name: video_quality
          in: formData
          description: Recording quality. Lower values mean higher quality. Defaults to 30.
          type: integer
          minimum: 0
          maximum: 63
        - name: video_fps
          in: formData
          description: Target frames per second for WebM and MP4. GIF uses 20 fps and ignores this value. Defaults
            to 30 for WebM and MP4.
          type: integer
          minimum: 1
          maximum: 30
        - name: video_scale
          in: formData
          description: Multiplier for recorded width and height. Defaults to 1 for WebM and MP4 and 0.5 for GIF.
          type: number
          minimum: 0.1
          maximum: 1
        - $ref: "#/parameters/form_hide_popups"
        - $ref: "#/parameters/form_steps"
        - $ref: "#/parameters/form_trackers"
        - $ref: "#/parameters/form_apps"
        - $ref: "#/parameters/form_tag"
      tags:
        - Batch
      responses:
        "200":
          description: batch information
          schema:
            $ref: "#/definitions/Batch"
        "400":
          $ref: "#/responses/InvalidRequest"
        "401":
          $ref: "#/responses/Unauthorized"
        "503":
          $ref: "#/responses/Unavailable"
        default:
          description: Batch not created
          schema:
            $ref: "#/definitions/BatchError"
  /batch/info:
    get:
      summary: Get the batch status
      operationId: GetBatchInfo
      description: Get the status of a batch requested through the API or through the dashboard.
      parameters:
        - name: id
          in: query
          description: batch ID
          type: integer
          required: true
      tags:
        - Batch
      responses:
        "200":
          description: batch information
          schema:
            $ref: "#/definitions/Batch"
        default:
          description: Batch not found
          schema:
            $ref: "#/definitions/BatchError"
