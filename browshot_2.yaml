    get:
      operationId: CreateSimpleScreenshot
      summary: Capture and return an image
      tags:
        - Screenshot
      description: Accepts the same capture parameters as /screenshot/create, plus thumbnail options. When
        capture is pending, follow the same-host continuation URL until the image is ready.
      produces:
