        - $ref: "#/parameters/video_duration"
        - $ref: "#/parameters/video_quality"
        - $ref: "#/parameters/video_fps"
        - $ref: "#/parameters/video_scale"
        - $ref: "#/parameters/hide_popups"
        - $ref: "#/parameters/steps"
        - $ref: "#/parameters/trackers"
        - $ref: "#/parameters/apps"
        - $ref: "#/parameters/tag"
