# Internal draft. The website build publishes browshot.yaml.
swagger: "2.0"
info:
  title: Browshot API (internal draft)
  description: |-
    Internal contract for Browshot API v2.
    Request and response conventions and API key authentication follow Browshot v1.

    Select a browser and capture country directly. Defaults are Chrome, United States,
    a 1024 × 768 CSS pixel viewport, and desktop emulation. Supply viewport dimensions
    and mobile mode, or select a named device from /device/list. The server rejects
    device combined with screen_width, screen_height, or mobile. Unsupported browser,
    country, device, or combination returns HTTP 400. Requests stay in the selected
    country. A temporarily unavailable capture location returns HTTP 503.

    Choose configured S3 and webhook apps using apps on capture requests. S3 runs after
    a successful capture. Webhooks report finished and failed captures using the
    screenshot/info response shape. Screenshot info includes separate app status.

    A capture costs one credit. HTML and PDF each add one credit, each additional
    shot adds one credit, and video adds one credit per started five seconds of
    requested duration. PDF and video require Chrome. Retina and ad blocking add
    no credits. Free monthly credits cover any v2 capture option and are used first,
    followed by paid credits. The free allowance is shared with v1. Failed captures
    and unavailable optional artifacts return the corresponding credits.

    Capture and information requests use a single metadata format.
    Boolean capture options accept 0 and 1. Where v1 accepted false and true as strings,
    those strings remain accepted. Supply PDF settings with pdf=1 and video settings with video=1.
  version: 2.0.0-draft
  contact:
    name: API Support
    email: support@browshot.com
    url: https://browshot.com/contact
  termsOfService: https://browshot.com/terms
host: api.browshot.com
schemes:
  - https
basePath: /api/v2
produces:
  - application/json
securityDefinitions:
  apiKeyQuery:
    type: apiKey
    name: key
    in: query
  apiKeyHeader:
    type: apiKey
    name: X-API-KEY
    in: header
security:
  - apiKeyQuery: []
  - apiKeyHeader: []
paths:
  /screenshot/create:
    get:
      summary: Request a screenshot
      operationId: CreateScreenshot
      x-ms-trigger: none
      description: Submit a capture using the selected browser, country, and viewport or device. The response
        is the v1-shaped screenshot object with resolved capture settings.
      parameters:
        - name: url
          in: query
          description: URL of the page to get a screenshot for
          required: true
          type: string
        - $ref: "#/parameters/browser"
        - $ref: "#/parameters/country"
        - $ref: "#/parameters/screen_width"
        - $ref: "#/parameters/screen_height"
        - $ref: "#/parameters/mobile"
        - $ref: "#/parameters/device"
        - name: size
          in: query
          description: screenshot size - "screen" (default) or "page"
          type: string
          enum:
            - screen
            - page
          default: screen
        - name: cache
          in: query
          description: Reuse a recent capture with the same URL, render settings, and tags within this many seconds. Use 0
            for a fresh capture. App selections apply to that request, including eligible cached
            captures.
          type: integer
          default: 86400
        - name: delay
          in: query
          description: number of seconds to wait after the page has loaded. This is used to let JavaScript run
            longer before taking the screenshot. Use delay=0 to take screenshots faster.
          type: integer
          default: 5
          minimum: 0
          maximum: 60
        - name: referer
          in: query
          description: use a custom referrer header
          type: string
        - name: post_data
          in: query
          description: send a POST requests with post_data, useful for filling out forms
          type: string
        - name: cookie
          in: query
          description: set a cookie for the URL requested (see Custom POST Data, Referer and Cookie) Cookies should
            be separated by a ;
          type: string
        - name: script
          in: query
          description: URL of javascript file to execute after the page load event
          type: string
        - name: html
          in: query
          description: saves the HTML of the rendered page which can be retrieved by the API call screenshot/html.
            This feature costs *1 credit* per screenshot.
          type: integer
          minimum: 0
          maximum: 1
          default: 0
        - name: max_wait
          description: "maximum number of seconds to wait before triggering the PageLoad event. Note that delay
            will still be used. (default: 0 = disabled)"
          in: query
          type: integer
          minimum: 0
          maximum: 60
          default: 0
        - name: headers
          in: query
          description: any custom HTTP headers. (Not supported with Internet Explorer)
          type: string
        - name: shots
          in: query
          description: Take multiple screenshots of the same page. Each additional shot costs one credit.
          type: integer
          minimum: 1
          maximum: 10
          default: 1
        - name: shot_interval
          in: query
          description: number of seconds between 2 screenshots
          type: integer
          minimum: 1
          maximum: 10
          default: 5
        - $ref: "#/parameters/device_scale"
        - $ref: "#/parameters/hide_ads"
        - $ref: "#/parameters/pdf"
        - $ref: "#/parameters/pdf_format"
        - $ref: "#/parameters/pdf_background"
        - $ref: "#/parameters/pdf_one_page"
        - $ref: "#/parameters/pdf_landscape"
        - $ref: "#/parameters/pdf_margin"
        - $ref: "#/parameters/pdf_margin_top"
        - $ref: "#/parameters/pdf_margin_bottom"
        - $ref: "#/parameters/pdf_margin_left"
        - $ref: "#/parameters/pdf_margin_right"
        - $ref: "#/parameters/video"
        - $ref: "#/parameters/video_format"
        - $ref: "#/parameters/video_duration"
        - $ref: "#/parameters/video_quality"
        - $ref: "#/parameters/video_fps"
        - $ref: "#/parameters/video_scale"
        - $ref: "#/parameters/hide_popups"
        - $ref: "#/parameters/steps"
        - $ref: "#/parameters/trackers"
        - $ref: "#/parameters/apps"
        - $ref: "#/parameters/tag"
      tags:
        - Screenshot
      responses:
        "200":
          description: Request accepted
          schema:
            $ref: "#/definitions/Screenshot"
        "400":
          $ref: "#/responses/InvalidRequest"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          description: Error
          schema:
            $ref: "#/definitions/ScreenshotError"
        "503":
          $ref: "#/responses/Unavailable"
    post:
      summary: Request a screenshot
      operationId: CreateScreenshotPost
      x-ms-trigger: none
      description: Submit a capture using the selected browser, country, and viewport or device. The response
        is the v1-shaped screenshot object with resolved capture settings.
      parameters:
        - name: url
          in: formData
          description: URL of the page to get a screenshot for
          required: true
          type: string
        - $ref: "#/parameters/form_browser"
        - $ref: "#/parameters/form_country"
        - $ref: "#/parameters/form_screen_width"
        - $ref: "#/parameters/form_screen_height"
        - $ref: "#/parameters/form_mobile"
        - $ref: "#/parameters/form_device"
        - name: size
          in: formData
          description: screenshot size - "screen" (default) or "page"
