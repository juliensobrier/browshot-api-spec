        - name: hide_ads
          in: formData
          description: Block advertising requests and hide matching ad elements. Adds no credits.
          type: integer
          enum:
            - 0
            - 1
          default: 0
        - name: pdf
          in: formData
          description: Generate a PDF in addition to the screenshot. Requires a Chrome capture and adds one
            credit. Use pdf=1 when supplying pdf_* options.
          type: integer
          enum:
            - 0
            - 1
          default: 0
        - name: pdf_format
          in: formData
          description: PDF paper size. Ignored when pdf_one_page is enabled. Defaults to letter.
          type: string
          enum:
            - letter
            - a4
            - legal
        - name: pdf_background
          in: formData
          description: Include background colors and images in the PDF. Defaults to 0.
          type: integer
          enum:
            - 0
            - 1
        - name: pdf_one_page
          in: formData
          description: Create one long PDF page using the viewport width and document height. Defaults to 0.
          type: integer
          enum:
            - 0
            - 1
        - name: pdf_landscape
          in: formData
          description: Use landscape orientation for the PDF. Defaults to 0.
          type: integer
          enum:
            - 0
            - 1
        - name: pdf_margin
          in: formData
          description: Set all four PDF margins to a nonnegative length. Units can be px, mm, cm, or in. A value
            without units is in pixels. Defaults to 0px.
          type: string
          pattern: ^\d+(\.\d+)?(px|mm|cm|in)?$
          maxLength: 32
        - name: pdf_margin_top
          in: formData
          description: Override the top PDF margin. Defaults to pdf_margin.
          type: string
          pattern: ^\d+(\.\d+)?(px|mm|cm|in)?$
          maxLength: 32
        - name: pdf_margin_bottom
          in: formData
          description: Override the bottom PDF margin. Defaults to pdf_margin.
          type: string
          pattern: ^\d+(\.\d+)?(px|mm|cm|in)?$
          maxLength: 32
        - name: pdf_margin_left
          in: formData
          description: Override the left PDF margin. Defaults to pdf_margin.
          type: string
          pattern: ^\d+(\.\d+)?(px|mm|cm|in)?$
          maxLength: 32
        - name: pdf_margin_right
          in: formData
          description: Override the right PDF margin. Defaults to pdf_margin.
          type: string
          pattern: ^\d+(\.\d+)?(px|mm|cm|in)?$
          maxLength: 32
        - name: video
          in: formData
          description: Record a video or animated GIF in addition to the screenshot. Requires a Chrome capture
            at device scale 1. Adds one credit per started five seconds. Use video=1 when supplying
            video_* options.
          type: integer
          enum:
            - 0
            - 1
          default: 0
        - name: video_format
          in: formData
          description: Recording format. If MP4 encoding is unavailable, the capture can produce WebM. Defaults to
            webm.
          type: string
          enum:
            - webm
            - mp4
            - gif
        - name: video_duration
          in: formData
          description: Maximum recording duration in seconds. Charges are calculated from the requested duration.
            Defaults to 15 seconds.
          type: integer
          minimum: 1
          maximum: 30
        - name: video_quality
          in: formData
          description: Recording quality. Lower values mean higher quality. Defaults to 30.
          type: integer
          minimum: 0
          maximum: 63
        - name: video_fps
          in: formData
          description: Target frames per second for WebM and MP4. GIF uses 20 fps and ignores this value. Defaults
            to 30 for WebM and MP4.
          type: integer
          minimum: 1
          maximum: 30
        - name: video_scale
          in: formData
          description: Multiplier for recorded width and height. Defaults to 1 for WebM and MP4 and 0.5 for GIF.
